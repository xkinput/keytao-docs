# Cloudflare Workers Configuration
name = "keytao-docs-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

# Worker type
workers_dev = true

# Environment Variables
[env.production]
vars = { VERCEL_DOMAIN = "your-docs.vercel.app" }

[env.development]
vars = { VERCEL_DOMAIN = "your-docs.vercel.app" }

# Custom domain routing (optional)
# 绑定自定义域名后在Cloudflare Dashboard配置
# routes = [
#   { pattern = "docs.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
